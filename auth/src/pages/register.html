<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account &middot; Zero-To-Kaban</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .auth-card {
        width: min(92vw, 24rem);
      }
    </style>
  </head>
  <body>
    <main class="auth-card">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <form id="form" novalidate>
            <h1 class="h5 mb-2">Create account</h1>
            <p class="form-text mb-3">
              Username: 3-32 characters, letters, digits, "-" or "_". Password:
              8+ characters. Your username is visible to other users: avoid
              using your real name.
            </p>

            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                autocomplete="username"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                pattern="[A-Za-z0-9_-]{3,32}"
                autofocus
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                autocomplete="new-password"
                minlength="8"
                maxlength="72"
                required
              />
            </div>

            <div class="mb-3">
              <label for="passwordConfirm" class="form-label"
                >Confirm password</label
              >
              <input
                type="password"
                class="form-control"
                id="passwordConfirm"
                name="passwordConfirm"
                autocomplete="new-password"
                minlength="8"
                maxlength="72"
                required
              />
            </div>

            <div class="text-danger small mb-3" id="error" role="alert"></div>

            <p class="form-text mb-3">
              By creating an account, you acknowledge our
              <a href="/privacy-policy" target="_blank" rel="noopener"
                >privacy policy</a
              >.
            </p>

            <button type="submit" class="btn btn-primary w-100">
              Create account
            </button>

            <p class="text-center small mt-3 mb-0">
              Already have an account?
              <a id="login-link" href="/login">Sign in</a>
            </p>
          </form>
        </div>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(location.search);
      // Keep only same-site absolute paths (the server enforces this too).
      const raw = params.get("next") || "/";
      const next = /^\/(?!\/)/.test(raw) ? raw : "/";
      document.getElementById("login-link").href =
        "/login?next=" + encodeURIComponent(next);

      document
        .getElementById("form")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const error = document.getElementById("error");
          error.textContent = "";

          const form = event.currentTarget;
          if (form.password.value !== form.passwordConfirm.value) {
            error.textContent = "Passwords do not match";
            return;
          }

          const res = await fetch("/auth/register", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              username: form.username.value,
              password: form.password.value,
              next,
            }),
          });

          if (res.ok) {
            const data = await res.json().catch(() => ({}));
            location.assign(data.next || next);
            return;
          }
          const data = await res.json().catch(() => ({}));
          error.textContent = data.error || "Registration failed";
        });
    </script>
  </body>
</html>
