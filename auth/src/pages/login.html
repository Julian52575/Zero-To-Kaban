<!doctype html>
<html lang="en">
  <head>
    
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in &middot; Zero-To-Kaban</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .skip-link {
        position: absolute;
        left: 1rem;
        top: 1rem;
        z-index: 10;
        padding: 0.5rem 0.75rem;
        border-radius: 0.375rem;
        background: #0d6efd;
        color: #fff;
        text-decoration: none;
      }
      .auth-card {
        width: min(92vw, 24rem);
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#form">Skip to main content</a>

    <main class="auth-card" id="main-content">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <form id="form" novalidate>
            <h1 class="h5 mb-3">Sign in</h1>

            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                autocomplete="username"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                pattern="[A-Za-z0-9_-]{3,32}"
                autofocus
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                autocomplete="current-password"
                required
              />
            </div>

            <div class="text-danger small mb-3" id="error" role="alert"></div>

            <button type="submit" class="btn btn-primary w-100">
              Continue
            </button>

            <p class="text-center small mt-3 mb-0">
              No account yet?
              <a id="register-link" href="/register">Create one</a>
            </p>
          </form>
        </div>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(location.search);
      // Keep only same-site absolute paths (the server enforces this too).
      const raw = params.get("next") || "/";
      const next = /^\/(?!\/)/.test(raw) ? raw : "/";
      // Carry ?next through to the register page so a guarded redirect
      // survives a "create an account" detour.
      document.getElementById("register-link").href =
        "/register?next=" + encodeURIComponent(next);

      document
        .getElementById("form")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const error = document.getElementById("error");
          error.textContent = "";

          const form = event.currentTarget;
          const res = await fetch("/auth/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              username: form.username.value,
              password: form.password.value,
              next,
            }),
          });

          if (res.ok) {
            const data = await res.json().catch(() => ({}));
            location.assign(data.next || next);
            return;
          }
          const data = await res.json().catch(() => ({}));
          error.textContent = data.error || "Sign in failed";
        });
    </script>
  </body>
</html>
