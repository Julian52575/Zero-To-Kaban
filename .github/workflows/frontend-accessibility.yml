name: frontend-accessibility

# Split out of ci.yml so accessibility feedback doesn't have to wait behind
# the whole backend/stack/SAST suite, and doesn't run at all on PRs that
# never touch the frontend. Not part of ci-required -- these are fast
# feedback for the frontend team, not a merge gate.
on:
  pull_request:
    paths:
      - "frontend/**"
  workflow_dispatch: # run on demand against any branch; see publish-rgaa-summary below

# Least privilege by default; publish-rgaa-summary elevates for its own push.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lighthouse CI (https://github.com/GoogleChrome/lighthouse-ci) accessibility
  # audit of the built SPA -- config in frontend/lighthouserc.json. Runs
  # alongside `frontend-a11y-rgaa` (no `needs` between them = parallel
  # scheduling), on its own build of `dist/` rather than sharing one across
  # jobs.
  frontend-a11y-lighthouse:
    name: frontend lighthouse accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run the Lighthouse CI accessibility audit
        run: npm run lhci

      - name: Publish the accessibility score summary
        if: always()
        run: |
          {
            echo '### Frontend accessibility (Lighthouse CI)'
            echo
            if [ -f lhci-reports/manifest.json ]; then
              min_score=$(jq '.ci.assert.assertions["categories:accessibility"][1].minScore' lighthouserc.json)
              min_pct=$(jq -n --argjson s "$min_score" '$s * 100 | round')

              jq -r '.[] | select(.isRepresentativeRun)
                | [.url, (.summary.accessibility * 100 | round), .jsonPath] | @tsv' \
                lhci-reports/manifest.json > /tmp/lhci-runs.tsv
              ref_json=$(head -1 /tmp/lhci-runs.tsv | cut -f3)

              echo "| Route | Score (${min_pct}% required) | Passing audits |"
              echo '| --- | --- | --- |'
              while IFS=$'\t' read -r url pct jsonPath; do
                route="${url#http://127.0.0.1:4173}"
                [ -z "$route" ] && route="/"
                if [ "$pct" -ge "$min_pct" ]; then icon="✅"; else icon="❌"; fi
                passed=$(jq '[.categories.accessibility.auditRefs[].id as $id
                  | .audits[$id] | select(.scoreDisplayMode == "binary" and .score == 1)] | length' "$jsonPath")
                total=$(jq '[.categories.accessibility.auditRefs[].id as $id
                  | .audits[$id] | select(.scoreDisplayMode == "binary")] | length' "$jsonPath")
                echo "| \`$route\` | ${icon} ${pct}% | ${passed} / ${total} |"
              done < /tmp/lhci-runs.tsv

              echo
              echo '#### Failing elements'
              while IFS=$'\t' read -r url pct jsonPath; do
                route="${url#http://127.0.0.1:4173}"
                [ -z "$route" ] && route="/"
                issues=$(jq -r '
                  . as $r
                  | ($r.categories.accessibility.auditRefs // [])[] as $ref
                  | ($r.audits[$ref.id]) as $a
                  | select($a.scoreDisplayMode == "binary" and $a.score != 1)
                  | (($r.categoryGroups[$ref.group].title) // "Other") as $group
                  | (($a.details.debugData.tags // []) | map(select(test("^RGAA-"))) | map(ltrimstr("RGAA-")) | join(", ")) as $rgaa
                  | (($a.details.items // [null]))[] as $item
                  | (($item.node.explanation // $a.description)
                      | gsub("\n"; " ")
                      | gsub("^Fix any of the following:\\s*"; "")
                      | gsub(" {2,}"; " ")) as $explanation
                  | [$group, ($item.node.selector // $a.title), $explanation, $rgaa] | @tsv
                ' "$jsonPath" | sort -t $'\t' -k1,1)

                echo
                if [ -z "$issues" ]; then
                  echo "<details><summary>\`$route\` — no failing elements</summary></details>"
                  continue
                fi
                count=$(printf '%s\n' "$issues" | wc -l)
                echo "<details open><summary>\`$route\` — $count issue(s)</summary>"
                last_group=""
                while IFS=$'\t' read -r group selector explanation rgaa; do
                  if [ "$group" != "$last_group" ]; then
                    echo
                    echo "**$group**"
                    echo
                    last_group="$group"
                  fi
                  if [ -n "$rgaa" ]; then
                    echo "- \`$selector\` — $explanation _(RGAA $rgaa)_"
                  else
                    echo "- \`$selector\` — $explanation"
                  fi
                done <<< "$issues"
                echo
                echo '</details>'
              done < /tmp/lhci-runs.tsv

              echo
              echo '#### Manual review needed'
              echo
              echo '_Lighthouse cannot verify these automatically -- same checklist for every route, not part of the score/gate above._'
              echo
              jq -r '.categories.accessibility.auditRefs[].id as $id
                | .audits[$id]
                | select(.scoreDisplayMode == "manual")
                | "- **\(.title)**: \(.description)"' "$ref_json"

              echo
              echo '---'
              lh_version=$(jq -r '.lighthouseVersion' "$ref_json")
              axe_version=$(jq -r '.environment.credits["axe-core"] // "n/a"' "$ref_json")
              fetch_time=$(jq -r '.fetchTime' "$ref_json")
              total_ms=0
              while IFS=$'\t' read -r _ _ jsonPath; do
                t=$(jq '.timing.total' "$jsonPath")
                total_ms=$(awk -v a="$total_ms" -v b="$t" 'BEGIN { printf "%.0f", a + b }')
              done < /tmp/lhci-runs.tsv
              total_s=$(awk -v ms="$total_ms" 'BEGIN { printf "%.1f", ms / 1000 }')
              echo "<sub>Lighthouse $lh_version · axe-core $axe_version · audited $fetch_time · total audit time ${total_s}s</sub>"
            else
              echo '_Lighthouse CI produced no report -- see the job logs._'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Lighthouse CI report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-lighthouse-report
          path: frontend/lhci-reports
          if-no-files-found: warn

  # eqo (https://github.com/kodalabs-io/eqo) RGAA v4.1.2 accessibility audit,
  # complementary to `frontend-a11y-lighthouse` -- config in
  # frontend/rgaa.config.ts. Branded "for NextJS projects" upstream but
  # verified locally against this Vite SPA: a static Babel-AST pass over
  # `src/` plus a Playwright/axe-core runtime pass against the built preview
  # server, with findings mapped to actual RGAA 4.1.2 criteria numbers
  # (Lighthouse only speaks WCAG success-criterion ids). Not a devDependency
  # for the same reason as @lhci/cli: pulled in via pinned npx (with its
  # peer deps @axe-core/playwright and playwright) so its dependency tree,
  # notably Playwright, never touches this workspace's lockfile/audit gate.
  # The compliance gate (zero automatically-detected RGAA violations; the
  # ~30% of criteria eqo can't verify are excluded from that rate) is
  # enforced by the dedicated step below rather than eqo's own --threshold
  # flag, so it applies identically whether the report was just generated
  # or reused from a cached run.
  #
  # On workflow_dispatch, this job first looks for an eqo report a
  # pull_request run of this same workflow already produced for this exact
  # commit, and reuses it instead of repeating the build + Playwright + eqo
  # pass. `status=completed` (not `success`) on purpose: the eqo job still
  # uploads its report even when the compliance gate fails, and a failed
  # gate is not a reason to redo work that already produced a report. The
  # lookup lives in a step (not a separate job with a `needs` edge) so a
  # no-op lookup on every ordinary PR doesn't cost this job an extra
  # runner-provisioning wait on the common, fast-feedback path.
  frontend-a11y-rgaa:
    name: frontend rgaa accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # actions/checkout below -- job permissions replace, not add to, the workflow default
      actions: read # gh api lookup + cross-run artifact download below
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Look up a prior pull_request run for this commit
        id: find_cached_run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `gh api` defaults to POST once any -f is given; GET must be explicit.
          run_id=$(gh api --method GET \
            "repos/${{ github.repository }}/actions/workflows/frontend-accessibility.yml/runs" \
            -f event=pull_request -f status=completed -f head_sha="${{ github.sha }}" \
            --jq '.workflow_runs[0].id // empty')
          if [ -n "$run_id" ]; then
            echo "Reusing the eqo report from run $run_id (commit ${{ github.sha }})"
          else
            echo "No prior pull_request run found for commit ${{ github.sha }}; will audit fresh"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Reuse the cached report from run ${{ steps.find_cached_run.outputs.run_id }}
        id: cached_report
        if: steps.find_cached_run.outputs.run_id != ''
        continue-on-error: true # fall through to a fresh audit if the artifact is gone (e.g. expired)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-rgaa-report
          path: frontend/rgaa-reports
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find_cached_run.outputs.run_id }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.cached_report.outcome != 'success'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.cached_report.outcome != 'success'
        run: npm ci

      - name: Build
        if: steps.cached_report.outcome != 'success'
        run: npm run build

      - name: Run the eqo RGAA accessibility audit
        if: steps.cached_report.outcome != 'success'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &

          npx --yes playwright@1.58.2 install --with-deps chromium

          ready=""
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && ready=1 && break
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "frontend did not respond on :4173 in time" >&2
            exit 1
          fi

          npx --yes -p @kodalabs-io/eqo@1.0.0 -p playwright@1.58.2 -p @axe-core/playwright@4.13.0 \
            -- eqo analyze --config rgaa.config.ts

      - name: Enforce the RGAA compliance gate
        run: |
          if [ ! -f rgaa-reports/rgaa-report.json ]; then
            echo "::error::no RGAA report available (neither cached nor freshly generated)"
            exit 1
          fi
          pct=$(jq -n --argjson r "$(jq '.summary.complianceRate' rgaa-reports/rgaa-report.json)" '$r * 100 | round')
          echo "RGAA automated compliance rate: ${pct}%"
          if [ "$pct" -lt 100 ]; then
            echo "::error::RGAA compliance rate ${pct}% is below the required 100%"
            exit 1
          fi

      - name: Publish the RGAA accessibility summary
        if: always()
        run: |
          {
            echo '### Frontend accessibility (eqo RGAA v4.1.2)'
            echo
            if [ -f rgaa-reports/rgaa.md ]; then
              python3 "$GITHUB_WORKSPACE/.github/scripts/rgaa-summary.py" rgaa-reports/rgaa.md
            else
              echo '_eqo produced no report -- see the job logs._'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the eqo RGAA report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-rgaa-report
          path: frontend/rgaa-reports
          if-no-files-found: warn

  # Manual-dispatch only: renders the eqo report into a tracked doc and
  # pushes it straight to the dispatched branch (no PR). Kept as its own job
  # so only this one needs contents: write -- the two audits above stay
  # read-only even when this workflow is dispatched manually.
  publish-rgaa-summary:
    name: publish RGAA summary to docs/
    # !cancelled() opts out of the implicit success() a plain `if:` would
    # otherwise AND onto `needs` -- this must still publish the audit when
    # frontend-a11y-rgaa *fails* its compliance gate (the whole point is to
    # document the current state, good or bad), just not on a cancelled run.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    needs: frontend-a11y-rgaa
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download the eqo RGAA report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-rgaa-report
          path: /tmp/rgaa-reports

      - name: Render docs/accessibility/rgaa-audit.md
        run: |
          mkdir -p docs/accessibility
          {
            echo '<!-- Auto-generated by the "frontend-accessibility" workflow (workflow_dispatch). Do not edit by hand -- it is overwritten on the next manual run. -->'
            echo
            python3 .github/scripts/rgaa-summary.py /tmp/rgaa-reports/rgaa.md
          } > docs/accessibility/rgaa-audit.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/accessibility/rgaa-audit.md
          if git diff --cached --quiet; then
            echo "RGAA audit doc unchanged."
            exit 0
          fi
          # [skip ci] so this push doesn't re-trigger ci.yml on an open PR
          # for this branch.
          git commit -m "docs(accessibility): update RGAA audit report [skip ci]"
          for attempt in 1 2 3; do
            git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "push rejected (attempt ${attempt}); rebasing onto ${{ github.ref_name }}"
            git pull --rebase --autostash origin ${{ github.ref_name }} || break
          done
          echo "::error::could not push the RGAA audit doc to ${{ github.ref_name }}"
          exit 1
