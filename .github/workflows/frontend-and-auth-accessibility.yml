name: frontend-and-auth-accessibility

# Split out of ci.yml so accessibility feedback doesn't have to wait behind
# the whole backend/stack/SAST suite, and doesn't run at all on PRs that
# never touch either service. Not part of ci-required -- these are fast
# feedback for the team, not a merge gate. frontend-a11y-lighthouse and the
# eqo pipeline (frontend-a11y-rgaa / auth-a11y-rgaa / a11y-rgaa-summary) all
# run in parallel -- no `needs` between them.
on:
  pull_request:
    paths:
      - "frontend/**"
      - "auth/**"
  workflow_dispatch: # run on demand against any branch; see publish-rgaa-summary below

# Least privilege by default; publish-rgaa-summary elevates for its own push.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # eqo (https://github.com/kodalabs-io/eqo) RGAA v4.1.2 accessibility audit
  # of the frontend SPA -- config in frontend/rgaa.config.ts. Branded "for
  # NextJS projects" upstream but verified locally against this Vite SPA: a
  # static Babel-AST pass over `src/` plus a Playwright/axe-core runtime pass
  # against the built preview server, with findings mapped to actual RGAA
  # 4.1.2 criteria numbers (Lighthouse only speaks WCAG success-criterion
  # ids).
  #
  # The cache-lookup / audit-and-gate logic itself lives in two reusable
  # composite actions (.github/actions/rgaa-cache-lookup and
  # .github/actions/rgaa-audit) shared with auth-a11y-rgaa below, so both
  # services are audited identically and a third service just calls the
  # same two actions after starting itself up. This job's own summary is
  # intentionally NOT published here -- see `a11y-rgaa-summary`, which
  # merges this with `auth-a11y-rgaa`'s report into one combined summary.
  frontend-a11y-rgaa:
    name: frontend rgaa accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # actions/checkout below -- job permissions replace, not add to, the workflow default
      actions: read # rgaa-cache-lookup: gh api lookup + cross-run artifact download
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - id: cache
        uses: ./.github/actions/rgaa-cache-lookup
        with:
          artifact-name: frontend-rgaa-report
          working-directory: frontend

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm run build

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/backend-with-seed-data

      - name: Start the frontend preview server
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          VITE_BACKEND_URL: http://127.0.0.1:3000
          # Opt-in header the Vite proxy injects for /api/* -- see
          # vite.config.js. Must match backend/prisma/seed.js's
          # A11Y_TEST_USER_ID, or the seeded project is invisible (401).
          FAKE_AUTH_USER_ID: a11y-test-user
        run: npm run preview -- --host 127.0.0.1 --port 4173 &

      - uses: ./.github/actions/rgaa-audit
        with:
          working-directory: frontend
          base-url: http://127.0.0.1:4173
          artifact-name: frontend-rgaa-report
          cache-hit: ${{ steps.cache.outputs.cache-hit }}

  # Mirrors frontend-a11y-rgaa against the auth service -- config in
  # auth/rgaa.config.ts. /login and /register are served directly by auth's
  # own Express app (bypassing the Traefik ForwardAuth guard in
  # docker-compose.yml entirely -- those two routes are exactly the ones the
  # guard excludes, so hitting auth directly needs no login flow scripted
  # into the accessibility tooling at all). That means this job doesn't need
  # the full docker-compose stack, just a database for Prisma's `$connect()`
  # at boot -- neither route touches it per-request.
  #
  # Not reusing docker-compose.yml's own `authdb` service for that: it
  # publishes no host port (by design, for local dev -- only other
  # containers on the compose network can reach it), and this job runs
  # `node src/index.js` directly on the runner, not inside that network. A
  # throwaway container with an explicit port mapping is simpler here than
  # changing docker-compose.yml's local-dev behavior just for CI.
  auth-a11y-rgaa:
    name: auth rgaa accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - id: cache
        uses: ./.github/actions/rgaa-cache-lookup
        with:
          artifact-name: auth-rgaa-report
          working-directory: auth

      - name: Start a throwaway Postgres for Prisma's $connect()
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run -d --name authdb -p 5432:5432 \
            -e POSTGRES_USER=authuser -e POSTGRES_PASSWORD=authpass -e POSTGRES_DB=auth \
            postgres:16-alpine

          ready=""
          for _ in $(seq 1 30); do
            docker exec authdb pg_isready -U authuser -d auth >/dev/null 2>&1 && ready=1 && break
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "authdb did not become ready in time" >&2
            docker logs authdb
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: auth/package-lock.json

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: auth
        run: npm ci

      - name: Generate the Prisma client
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: auth
        run: npx prisma generate

      - name: Start the auth server
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: auth
        env:
          DATABASE_URL: postgresql://authuser:authpass@localhost:5432/auth?schema=public
          SESSION_SECRET: ci-a11y-audit
        run: node src/index.js &

      - uses: ./.github/actions/rgaa-audit
        with:
          working-directory: auth
          base-url: http://127.0.0.1:4000
          ready-path: /health
          artifact-name: auth-rgaa-report
          cache-hit: ${{ steps.cache.outputs.cache-hit }}

  # Merges frontend-a11y-rgaa's and auth-a11y-rgaa's reports into one summary
  # via rgaa-summary.py (worst-status-wins per shared RGAA criterion, routes
  # from both services listed together). !cancelled() so this still runs --
  # and still gives the team a combined view -- when either audit fails its
  # own compliance gate; only a cancelled run skips it.
  a11y-rgaa-summary:
    name: frontend + auth rgaa accessibility summary
    if: ${{ !cancelled() }}
    needs: [frontend-a11y-rgaa, auth-a11y-rgaa]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download the frontend eqo report
        continue-on-error: true # still summarize whatever came in if one side never uploaded
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-rgaa-report
          path: /tmp/rgaa-reports/frontend

      - name: Download the auth eqo report
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: auth-rgaa-report
          path: /tmp/rgaa-reports/auth

      - name: Publish the combined RGAA accessibility summary
        run: |
          mkdir -p /tmp/rgaa-merged
          inputs=()
          [ -f /tmp/rgaa-reports/frontend/rgaa.md ] && inputs+=(/tmp/rgaa-reports/frontend/rgaa.md)
          [ -f /tmp/rgaa-reports/auth/rgaa.md ] && inputs+=(/tmp/rgaa-reports/auth/rgaa.md)
          {
            echo '### Frontend + auth accessibility (eqo RGAA v4.1.2)'
            echo
            if [ "${#inputs[@]}" -eq 0 ]; then
              echo '_eqo produced no reports -- see the job logs._'
            else
              python3 .github/scripts/rgaa-summary.py "${inputs[@]}" | tee /tmp/rgaa-merged/rgaa.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the merged RGAA report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-rgaa-report-merged
          path: /tmp/rgaa-merged
          if-no-files-found: warn

  # Lighthouse CI (https://github.com/GoogleChrome/lighthouse-ci) accessibility
  # audit of the built SPA -- config in frontend/lighthouserc.json. Frontend
  # only: auth has no SPA build, and eqo above already covers it. Runs
  # alongside the eqo pipeline (no `needs` between them = parallel
  # scheduling), on its own build of `dist/` rather than sharing one across
  # jobs.
  frontend-a11y-lighthouse:
    name: frontend lighthouse accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: ./.github/actions/backend-with-seed-data

      - name: Run the Lighthouse CI accessibility audit
        env:
          VITE_BACKEND_URL: http://127.0.0.1:3000
          # Opt-in header the Vite proxy injects for /api/* -- see
          # vite.config.js. Must match backend/prisma/seed.js's
          # A11Y_TEST_USER_ID, or the seeded project is invisible (401).
          # lhci's startServerCommand (lighthouserc.json) inherits these
          # since it's spawned from this same step.
          FAKE_AUTH_USER_ID: a11y-test-user
        run: npm run lhci

      - name: Publish the accessibility score summary
        if: always()
        run: |
          {
            echo '### Frontend accessibility (Lighthouse CI)'
            echo
            if [ -f lhci-reports/manifest.json ]; then
              min_score=$(jq '.ci.assert.assertions["categories:accessibility"][1].minScore' lighthouserc.json)
              min_pct=$(jq -n --argjson s "$min_score" '$s * 100 | round')

              jq -r '.[] | select(.isRepresentativeRun)
                | [.url, (.summary.accessibility * 100 | round), .jsonPath] | @tsv' \
                lhci-reports/manifest.json > /tmp/lhci-runs.tsv
              ref_json=$(head -1 /tmp/lhci-runs.tsv | cut -f3)

              echo "| Route | Score (${min_pct}% required) | Passing audits |"
              echo '| --- | --- | --- |'
              while IFS=$'\t' read -r url pct jsonPath; do
                route="${url#http://127.0.0.1:4173}"
                [ -z "$route" ] && route="/"
                if [ "$pct" -ge "$min_pct" ]; then icon="✅"; else icon="❌"; fi
                passed=$(jq '[.categories.accessibility.auditRefs[].id as $id
                  | .audits[$id] | select(.scoreDisplayMode == "binary" and .score == 1)] | length' "$jsonPath")
                total=$(jq '[.categories.accessibility.auditRefs[].id as $id
                  | .audits[$id] | select(.scoreDisplayMode == "binary")] | length' "$jsonPath")
                echo "| \`$route\` | ${icon} ${pct}% | ${passed} / ${total} |"
              done < /tmp/lhci-runs.tsv

              echo
              echo '#### Failing elements'
              while IFS=$'\t' read -r url pct jsonPath; do
                route="${url#http://127.0.0.1:4173}"
                [ -z "$route" ] && route="/"
                issues=$(jq -r '
                  . as $r
                  | ($r.categories.accessibility.auditRefs // [])[] as $ref
                  | ($r.audits[$ref.id]) as $a
                  | select($a.scoreDisplayMode == "binary" and $a.score != 1)
                  | (($r.categoryGroups[$ref.group].title) // "Other") as $group
                  | (($a.details.debugData.tags // []) | map(select(test("^RGAA-"))) | map(ltrimstr("RGAA-")) | join(", ")) as $rgaa
                  | (($a.details.items // [null]))[] as $item
                  | (($item.node.explanation // $a.description)
                      | gsub("\n"; " ")
                      | gsub("^Fix any of the following:\\s*"; "")
                      | gsub(" {2,}"; " ")) as $explanation
                  | [$group, ($item.node.selector // $a.title), $explanation, $rgaa] | @tsv
                ' "$jsonPath" | sort -t $'\t' -k1,1)

                echo
                if [ -z "$issues" ]; then
                  echo "<details><summary>\`$route\` — no failing elements</summary></details>"
                  continue
                fi
                count=$(printf '%s\n' "$issues" | wc -l)
                echo "<details open><summary>\`$route\` — $count issue(s)</summary>"
                last_group=""
                while IFS=$'\t' read -r group selector explanation rgaa; do
                  if [ "$group" != "$last_group" ]; then
                    echo
                    echo "**$group**"
                    echo
                    last_group="$group"
                  fi
                  if [ -n "$rgaa" ]; then
                    echo "- \`$selector\` — $explanation _(RGAA $rgaa)_"
                  else
                    echo "- \`$selector\` — $explanation"
                  fi
                done <<< "$issues"
                echo
                echo '</details>'
              done < /tmp/lhci-runs.tsv

              echo
              echo '#### Manual review needed'
              echo
              echo '_Lighthouse cannot verify these automatically -- same checklist for every route, not part of the score/gate above._'
              echo
              jq -r '.categories.accessibility.auditRefs[].id as $id
                | .audits[$id]
                | select(.scoreDisplayMode == "manual")
                | "- **\(.title)**: \(.description)"' "$ref_json"

              echo
              echo '---'
              lh_version=$(jq -r '.lighthouseVersion' "$ref_json")
              axe_version=$(jq -r '.environment.credits["axe-core"] // "n/a"' "$ref_json")
              fetch_time=$(jq -r '.fetchTime' "$ref_json")
              total_ms=0
              while IFS=$'\t' read -r _ _ jsonPath; do
                t=$(jq '.timing.total' "$jsonPath")
                total_ms=$(awk -v a="$total_ms" -v b="$t" 'BEGIN { printf "%.0f", a + b }')
              done < /tmp/lhci-runs.tsv
              total_s=$(awk -v ms="$total_ms" 'BEGIN { printf "%.1f", ms / 1000 }')
              echo "<sub>Lighthouse $lh_version · axe-core $axe_version · audited $fetch_time · total audit time ${total_s}s</sub>"
            else
              echo '_Lighthouse CI produced no report -- see the job logs._'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Lighthouse CI report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-lighthouse-report
          path: frontend/lhci-reports
          if-no-files-found: warn

  # Manual-dispatch only: pushes the merged report into a tracked doc,
  # straight to the dispatched branch (no PR). Kept as its own job so only
  # this one needs contents: write -- the audits and the summary above stay
  # read-only even when this workflow is dispatched manually.
  publish-rgaa-summary:
    name: publish RGAA summary to docs/
    # !cancelled() opts out of the implicit success() a plain `if:` would
    # otherwise AND onto `needs` -- this must still publish when either
    # audit *fails* its compliance gate (the whole point is to document the
    # current state, good or bad), just not on a cancelled run.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    needs: a11y-rgaa-summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download the merged RGAA report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: a11y-rgaa-report-merged
          path: /tmp/rgaa-merged

      - name: Render docs/accessibility/rgaa-audit.md
        run: |
          mkdir -p docs/accessibility
          {
            echo '<!-- Auto-generated by the "frontend-and-auth-accessibility" workflow (workflow_dispatch). Do not edit by hand -- it is overwritten on the next manual run. -->'
            echo
            cat /tmp/rgaa-merged/rgaa.md
          } > docs/accessibility/rgaa-audit.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/accessibility/rgaa-audit.md
          if git diff --cached --quiet; then
            echo "RGAA audit doc unchanged."
            exit 0
          fi
          # [skip ci] so this push doesn't re-trigger ci.yml on an open PR
          # for this branch.
          git commit -m "docs(accessibility): update RGAA audit report [skip ci]"
          for attempt in 1 2 3; do
            git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "push rejected (attempt ${attempt}); rebasing onto ${{ github.ref_name }}"
            git pull --rebase --autostash origin ${{ github.ref_name }} || break
          done
          echo "::error::could not push the RGAA audit doc to ${{ github.ref_name }}"
          exit 1
