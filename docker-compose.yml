# App stack: a Traefik reverse proxy in front of a split React/Express app.
#
#   http://localhost:8000/           -> frontend (Vite dev server, ./frontend)
#   http://localhost:8000/api/items      -> backend  (Express API, ./backend)
#   http://localhost:8000/login      -> auth     (username-only sign-in page, ./auth)
#   http://localhost:8000/auth/*     -> auth     (login, logout, logout-all, me)
#   http://localhost:8080/           -> Traefik dashboard (insecure, local only)
#
# Every route EXCEPT the auth ones above is guarded by the `require-login`
# ForwardAuth middleware: Traefik calls auth:/internal/verify first and only
# proxies the request on a 2xx, injecting a trusted X-Auth-User-Id header.
# An unauthenticated browser hit is redirected to /login; an API call gets 401.
# Fail-closed: if the `auth` service is down, guarded routes return 5xx.
#
# Traefik discovers routes from each container's `traefik.*` labels through
# the Podman API socket that the Nix dev shell exposes as $DOCKER_SOCK.
# `just up` builds images on first run; after editing ./backend, ./frontend,
# ./auth or a Dockerfile run `just rm; just up` to force a clean rebuild
# (podman-compose's `--build` often misses a changed COPY).

# This docker-compose is meant for local development

services:
  proxy:
    image: docker.io/library/traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true # dashboard on :8080 with no auth -- dev only
      - --accesslog=true
    ports:
      - "${PROXY_PORT:-8000}:80"
      - "${PROXY_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro"
    labels:
      # Middleware DEFINITIONS live on the proxy -- the first container up --
      # so they are registered before the frontend/backend routers reference
      # them (avoids a transient `middleware "require-login@docker" does not
      # exist` at boot). `traefik.enable=true` is required for Traefik to read
      # its own container's labels while exposedbydefault=false; no router rule
      # is defined here, so nothing about the proxy gets exposed.
      - traefik.enable=true

      # ForwardAuth: Traefik calls this on each guarded request; the 2xx
      # response's headers are copied onto the upstream request.
      - traefik.http.middlewares.require-login.forwardauth.address=http://auth:4000/internal/verify
      - traefik.http.middlewares.require-login.forwardauth.authResponseHeaders=X-Auth-User-Id,X-Auth-User-Name
      - traefik.http.middlewares.require-login.forwardauth.trustForwardHeader=true

      # Strip any client-supplied identity headers so ONLY ForwardAuth can set
      # them. Chained before require-login on each guarded router.
      - traefik.http.middlewares.strip-identity.headers.customRequestHeaders.X-Auth-User-Id=
      - traefik.http.middlewares.strip-identity.headers.customRequestHeaders.X-Auth-User-Name=

  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo}
      POSTGRES_DB: ${POSTGRES_DB:-todo}
    volumes:
      - todo-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo} -d ${POSTGRES_DB:-todo}"]
      interval: 1s
      timeout: 1s
      retries: 10
      start_period: 1s

  # The login service owns its own database -- separate blast radius, separate
  # migrations and backups from the app data in `db`, and its own credentials
  # (AUTH_POSTGRES_*) so a leak of one set does not grant access to the other.
  authdb:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER:-authuser}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:-authpass}
      POSTGRES_DB: ${AUTH_POSTGRES_DB:-auth}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER:-authuser} -d ${AUTH_POSTGRES_DB:-auth}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  auth:
    build:
      context: ./auth
    environment:
      DATABASE_URL: postgresql://${AUTH_POSTGRES_USER:-authuser}:${AUTH_POSTGRES_PASSWORD:-authpass}@authdb:5432/${AUTH_POSTGRES_DB:-auth}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (openssl rand -hex 32)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      authdb:
        condition: service_healthy
    labels:
      - traefik.enable=true

      # Public router: the /login page + the /auth/* API. NO guard here, or the
      # login form itself would be unreachable. Priority sits above the backend
      # /items router (10) and the frontend catch-all (1). The rule does NOT
      # match /internal, so /internal/verify stays proxy-only.
      #
      # The `require-login` / `strip-identity` middlewares this stack uses are
      # defined on the `proxy` service, not here.
      - traefik.http.routers.auth.rule=PathPrefix(`/auth`) || Path(`/login`) || Path(`/register`)
      - traefik.http.routers.auth.priority=100
      - traefik.http.services.auth.loadbalancer.server.port=4000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4000/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    # Run as the image's own `rabbitmq` user for the whole container lifetime
    user: rabbitmq
    volumes:
      # `:U` chowns the volume to the container's uid (rabbitmq) on start.
      # Needed because we bypass the entrypoint's own root->rabbitmq chown
      # step by never starting as root (see `user:` above), so nothing else
      # would make a fresh volume writable by the non-root rabbitmq user.
      - rabbitmq-data:/var/lib/rabbitmq:U
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 1s
      timeout: 2s
      retries: 20
      start_period: 5s

  backend:
    #image: ghcr.io/julian52575/zero-to-kanban-backend:manual-test #latest
    build:
      context: ./backend
      dockerfile: Dev.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-todo}:${POSTGRES_PASSWORD:-todo}@db:5432/${POSTGRES_DB:-todo}?schema=public
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_started
      proxy:
        condition: service_started
    labels:
      # Middleware DEFINITIONS live on the proxy -- the first container up --
      # so they are registered before the frontend/backend routers reference
      # them (avoids a transient `middleware "require-login@docker" does not
      # exist` at boot). `traefik.enable=true` is required for Traefik to read
      # its own container's labels while exposedbydefault=false; no router rule
      # is defined here, so nothing about the proxy gets exposed.
      - traefik.enable=true

      # ForwardAuth: Traefik calls this on each guarded request; the 2xx
      # response's headers are copied onto the upstream request.
      - traefik.http.middlewares.require-login.forwardauth.address=http://auth:4000/internal/verify
      - traefik.http.middlewares.require-login.forwardauth.authResponseHeaders=X-Auth-User-Id,X-Auth-User-Name
      - traefik.http.middlewares.require-login.forwardauth.trustForwardHeader=true

      # Strip any client-supplied identity headers so ONLY ForwardAuth can set
      # them. Chained before require-login on each guarded router.
      - traefik.http.middlewares.strip-identity.headers.customRequestHeaders.X-Auth-User-Id=
      - traefik.http.middlewares.strip-identity.headers.customRequestHeaders.X-Auth-User-Name=

      - traefik.http.middlewares.backend-stripprefix.stripprefix.prefixes=/api

      - traefik.http.routers.backend.rule=PathPrefix(`/api`)
      - traefik.http.routers.backend.priority=10
      - traefik.http.routers.backend.middlewares=strip-identity@docker,require-login@docker,backend-stripprefix
      - traefik.http.services.backend.loadbalancer.server.port=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 1s
      timeout: 1s
      retries: 20
      start_period: 1s

  frontend:
    #image: ghcr.io/julian52575/zero-to-kanban-frontend:manual-test #latest
    build:
      context: ./frontend
      dockerfile: Dev.Dockerfile
    environment:
      VITE_BACKEND_URL: http://backend:3000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.priority=1        # catch-all: lowest priority
      - traefik.http.services.frontend.loadbalancer.server.port=3000
      # Guard: same as backend -- an unauthenticated hit is redirected to /login.
      - traefik.http.routers.frontend.middlewares=strip-identity@docker,require-login@docker
    restart: unless-stopped

volumes:
  todo-db-data:
  auth-db-data:
  rabbitmq-data:
  frontend-node-modules:
