# App stack: a Traefik reverse proxy in front of a split React/Express app.
#
#   http://localhost:8000/           -> frontend (Vite dev server, ./frontend)
#   http://localhost:8000/api/items  -> backend (Express API, ./backend)
#   http://localhost:8000/ws         -> backend WebSocket
#   http://localhost:8000/login      -> auth (username-only sign-in page, ./auth)
#   http://localhost:8000/auth/*     -> auth (login, logout, logout-all, me)
#   http://localhost:8080/           -> Traefik dashboard (insecure, local only)

services:
  proxy:
    image: docker.io/library/traefik:v3.3
    restart: unless-stopped

    command:
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --accesslog=true

    ports:
      - "${PROXY_PORT:-8000}:80"
      - "${PROXY_DASHBOARD_PORT:-8080}:8080"

    volumes:
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro"

    labels:
      - traefik.enable=true

      # ForwardAuth
      - traefik.http.middlewares.require-login.forwardauth.address=http://auth:4000/internal/verify
      - traefik.http.middlewares.require-login.forwardauth.authResponseHeaders=X-Auth-User-Id,X-Auth-User-Name
      - traefik.http.middlewares.require-login.forwardauth.trustForwardHeader=true

      # Remove client-supplied identity headers
      - traefik.http.middlewares.strip-identity.headers.customRequestHeaders.X-Auth-User-Id=
      - traefik.http.middlewares.strip-identity.headers.customRequestHeaders.X-Auth-User-Name=

  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo}
      POSTGRES_DB: ${POSTGRES_DB:-todo}

    volumes:
      - todo-db-data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-todo} -d ${POSTGRES_DB:-todo}"
        ]
      interval: 1s
      timeout: 1s
      retries: 10
      start_period: 1s

  authdb:
    image: docker.io/library/postgres:16-alpine

    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER:-authuser}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:-authpass}
      POSTGRES_DB: ${AUTH_POSTGRES_DB:-auth}

    volumes:
      - auth-db-data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AUTH_POSTGRES_USER:-authuser} -d ${AUTH_POSTGRES_DB:-auth}"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  auth:
    build:
      context: ./auth

    environment:
      DATABASE_URL: postgresql://${AUTH_POSTGRES_USER:-authuser}:${AUTH_POSTGRES_PASSWORD:-authpass}@authdb:5432/${AUTH_POSTGRES_DB:-auth}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (openssl rand -hex 32)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}

    depends_on:
      authdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    labels:
      - traefik.enable=true

      # Public router: the /login page + the /auth/* API. NO guard here, or the
      # login form itself would be unreachable. Priority sits above the backend
      # /items router (10) and the frontend catch-all (1). The rule does NOT
      # match /internal, so /internal/verify stays proxy-only.
      #
      # The `require-login` / `strip-identity` middlewares this stack uses are
      # defined on the `proxy` service, not here.
      - traefik.http.routers.auth.rule=PathPrefix(`/auth`) || Path(`/login`) || Path(`/register`) || Path(`/privacy-policy`)
      # Public auth routes
      - traefik.http.routers.auth.rule=PathPrefix(`/auth`) || Path(`/login`) || Path(`/register`)
      - traefik.http.routers.auth.priority=100
      - traefik.http.services.auth.loadbalancer.server.port=4000

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      - "5672:5672"
      - "15672:15672"

    user: rabbitmq

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq:U

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 1s
      timeout: 2s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dev.Dockerfile

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-todo}:${POSTGRES_PASSWORD:-todo}@db:5432/${POSTGRES_DB:-todo}?schema=public
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}

    depends_on:
      db:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      auth:
        condition: service_started

      proxy:
        condition: service_started

    labels:
      - traefik.enable=true

      # =========================
      # Traefik middlewares
      # =========================

      - traefik.http.middlewares.require-login.forwardauth.address=http://auth:4000/internal/verify
      - traefik.http.middlewares.require-login.forwardauth.authResponseHeaders=X-Auth-User-Id,X-Auth-User-Name
      - traefik.http.middlewares.require-login.forwardauth.trustForwardHeader=true

      - traefik.http.middlewares.strip-identity.headers.customRequestHeaders.X-Auth-User-Id=
      - traefik.http.middlewares.strip-identity.headers.customRequestHeaders.X-Auth-User-Name=

      # Remove /api before sending request to Express
      - traefik.http.middlewares.backend-stripprefix.stripprefix.prefixes=/api

      # =========================
      # WebSocket
      # =========================

      - traefik.http.routers.websocket.rule=Path(`/ws`)
      - traefik.http.routers.websocket.priority=20
      - traefik.http.routers.websocket.middlewares=strip-identity@docker,require-login@docker
      - traefik.http.routers.websocket.service=websocket
      - traefik.http.services.websocket.loadbalancer.server.port=3000

      # =========================
      # Backend API
      # =========================

      - traefik.http.routers.backend.rule=PathPrefix(`/api`)
      - traefik.http.routers.backend.priority=10
      - traefik.http.routers.backend.middlewares=strip-identity@docker,require-login@docker,backend-stripprefix
      - traefik.http.routers.backend.service=backend
      - traefik.http.services.backend.loadbalancer.server.port=3000

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 1s
      timeout: 1s
      retries: 20
      start_period: 1s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dev.Dockerfile

    environment:
      VITE_BACKEND_URL: http://backend:3000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

    depends_on:
      backend:
        condition: service_healthy

    labels:
      - traefik.enable=true

      # Frontend catch-all
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=3000

      # Authentication
      - traefik.http.routers.frontend.middlewares=strip-identity@docker,require-login@docker

    restart: unless-stopped

volumes:
  todo-db-data:
  auth-db-data:
  rabbitmq-data:
  frontend-node-modules:
