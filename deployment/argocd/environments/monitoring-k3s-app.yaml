# Alertmanager + a lean Prometheus feeding it, for the local rootless k3s
# cluster (see deployment/flake.nix). Sourced directly from the upstream
# Helm repo -- no chart of our own to maintain here.
#
# Sized from hands-on local testing (see the monitoring ADR): kube-state-metrics,
# node-exporter and the pushgateway are all disabled --
# prometheus-node-exporter in particular fails outright under rootless k3s
# ("path "/" is mounted on "/" but it is not a shared or slave mount", since
# it needs to bind-mount the host root) and per-pod/container metrics are
# already covered by the kubelet's built-in cadvisor without it. Persistence
# is off (emptyDir) -- fine for a disposable local cluster, revisit before
# this is reused anywhere data should survive a pod restart.
#
# Alertmanager's receiver is a deliberate no-op for now ("discard-all-alerts",
# no *_configs at all) -- there's no real notification target (Slack
# webhook, ntfy, ...) wired up yet, and one shouldn't be invented here.
# Point `alertmanager.config.receivers` at a real one when you have it;
# keep the URL itself in a Secret (extraSecretMounts / mounted config)
# rather than inline in this file, since Application manifests live in git.
#
# Alert rules (ADR, discussion #131) use what Prometheus scrapes with no extra
# config: Traefik's :9100 metrics port and the kubelet's cAdvisor. The same rules
# are inlined in monitoring-prod-app.yaml -- keep the two in step.
#
# `just up-local` applies it; otherwise apply it by hand from `nix develop ./deployment`:
#   kubectl apply -n argocd -f deployment/argocd/environments/monitoring-k3s-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ztk-monitoring-k3s
  namespace: argocd
  # Dev only: deleting this Application also deletes everything it deployed
  # (`just rm` relies on this). Prod leaves it off so an accidental delete
  # can't take the workloads and their data with it.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.33.0
    helm:
      values: |
        kube-state-metrics:
          enabled: false
        prometheus-node-exporter:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        server:
          persistentVolume:
            enabled: false
        alertmanager:
          enabled: true
          persistence:
            enabled: false
          config:
            route:
              receiver: discard-all-alerts
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 3h
            receivers:
              - name: discard-all-alerts
        serverFiles:
          alerting_rules.yml:
            groups:
              - name: ztk-edge
                rules:
                  - alert: TraefikHigh5xxRatio
                    expr: |
                      sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))
                        / sum by (service) (rate(traefik_service_requests_total[5m])) > 0.05
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "{{ $labels.service }} answers more than 5% of requests with a 5xx"
                      description: "Over the last 5m, {{ $value | humanizePercentage }} of the requests Traefik routed to {{ $labels.service }} failed with a 5xx."
                  - alert: TraefikHighLatency
                    expr: |
                      histogram_quantile(0.95, sum by (le, service) (rate(traefik_service_request_duration_seconds_bucket[5m]))) > 1
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "{{ $labels.service }} p95 latency is above 1s"
                      description: "The 95th percentile of the request duration Traefik measured for {{ $labels.service }} is {{ $value | humanizeDuration }}."
              - name: ztk-workloads
                rules:
                  - alert: ContainerMemoryNearLimit
                    # max by (...): after a restart cAdvisor briefly exposes two series
                    # per container, which breaks a plain one-to-one match.
                    expr: |
                      max by (namespace, pod, container) (container_memory_working_set_bytes{namespace=~"ztk-.+", container!="", container!="POD"})
                        / on (namespace, pod, container)
                      max by (namespace, pod, container) (container_spec_memory_limit_bytes{namespace=~"ztk-.+", container!="", container!="POD"} > 0) > 0.9
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) uses over 90% of its memory limit"
                      description: "Working set is at {{ $value | humanizePercentage }} of the container's memory limit; it will be OOM-killed if it reaches it."
              - name: ztk-monitoring
                rules:
                  - alert: ScrapeTargetDown
                    expr: up{job=~"kubernetes-pods|kubernetes-nodes-cadvisor|prometheus"} == 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})"
                      description: "The target has been down for 5m, so the alerts that depend on it are blind."
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
