# Grafana for the local k3s cluster, reading the Prometheus and Alertmanager of
# monitoring-k3s-app.yaml. Provisioned entirely from this file: two datasources
# and the "Zero To Kanban overview" dashboard, which is read-only in the UI (edit
# the JSON below, and keep grafana-prod-app.yaml in step).
#
# Local only: published dev login (admin / dev-only-change-me), nothing persisted.
# `just up-local` applies it and binds it to localhost:18083.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ztk-grafana-k3s
  namespace: argocd
  # Dev only: `just rm` relies on deleting the Application to delete its resources.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 13.2.7
    helm:
      values: |
        adminUser: admin
        adminPassword: dev-only-change-me
        persistence:
          enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 768Mi
        service:
          type: ClusterIP
        # No sidecar, so a namespaced Role is enough.
        rbac:
          namespaced: true
        testFramework:
          enabled: false
        # No update checks or analytics.
        grafana.ini:
          analytics:
            check_for_updates: false
            reporting_enabled: false
          users:
            allow_sign_up: false
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                uid: prometheus
                type: prometheus
                access: proxy
                url: http://ztk-monitoring-k3s-prometheus-server.monitoring.svc.cluster.local
                isDefault: true
              - name: Alertmanager
                uid: alertmanager
                type: alertmanager
                access: proxy
                url: http://ztk-monitoring-k3s-alertmanager.monitoring.svc.cluster.local:9093
                jsonData:
                  implementation: prometheus
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: ztk
                folder: Zero To Kanban
                type: file
                disableDeletion: true
                allowUiUpdates: false
                options:
                  path: /var/lib/grafana/dashboards/ztk
        dashboards:
          ztk:
            overview:
              json: |
                {
                  "uid": "ztk-overview",
                  "title": "Zero To Kanban overview",
                  "tags": ["ztk"],
                  "timezone": "browser",
                  "schemaVersion": 39,
                  "version": 1,
                  "editable": false,
                  "refresh": "30s",
                  "time": {"from": "now-6h", "to": "now"},
                  "templating": {"list": []},
                  "annotations": {"list": []},
                  "panels": [
                    {"id":1,"type":"stat","title":"Alerts firing","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"x":0,"y":0,"w":6,"h":4},"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"custom":{},"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},"overrides":[]},"targets":[{"expr":"count(ALERTS{alertstate=\"firing\"}) or vector(0)","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"description":"Alerts Prometheus has sent to Alertmanager. See the Prometheus /alerts page for the rule behind each.","options":{"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}}},
                    {"id":2,"type":"stat","title":"Alerts pending","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"x":6,"y":0,"w":6,"h":4},"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"custom":{},"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":1}]}},"overrides":[]},"targets":[{"expr":"count(ALERTS{alertstate=\"pending\"}) or vector(0)","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"description":"Rule conditions that are true but have not lasted their 'for' delay yet. Pending alerts are not sent to Alertmanager.","options":{"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}}},
                    {"id":3,"type":"stat","title":"Scrape targets down","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"x":12,"y":0,"w":6,"h":4},"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"custom":{},"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},"overrides":[]},"targets":[{"expr":"count(up == 0) or vector(0)","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"options":{"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}}},
                    {"id":4,"type":"stat","title":"Prometheus series in memory","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"x":18,"y":0,"w":6,"h":4},"fieldConfig":{"defaults":{"color":{"mode":"fixed","fixedColor":"blue"},"custom":{}},"overrides":[]},"targets":[{"expr":"prometheus_tsdb_head_series","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"description":"Drives Prometheus memory and disk use. Compare with the retention sizing in monitoring-prod-app.yaml.","options":{"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}}},
                    {"id":5,"type":"timeseries","title":"Alert history (1 = pending or firing)","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"x":0,"y":4,"w":24,"h":6},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"lineWidth":1,"fillOpacity":8,"showPoints":"never"},"min":0,"max":1},"overrides":[]},"targets":[{"expr":"ALERTS{alertstate=~\"pending|firing\"}","legendFormat":"{{alertname}} {{alertstate}} {{service}}","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"description":"One line per alert while it was pending or firing. Kept as long as Prometheus keeps its data (local: until its pod restarts; prod: 7 days).","options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["max"]},"tooltip":{"mode":"multi"}}},
                    {"id":6,"type":"timeseries","title":"Requests per second, per Traefik service","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"x":0,"y":10,"w":12,"h":8},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"lineWidth":1,"fillOpacity":8,"showPoints":"never"},"unit":"reqps"},"overrides":[]},"targets":[{"expr":"sum by (service) (rate(traefik_service_requests_total[5m]))","legendFormat":"{{service}}","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["max"]},"tooltip":{"mode":"multi"}}},
                    {"id":7,"type":"timeseries","title":"5xx ratio, per Traefik service","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"x":12,"y":10,"w":12,"h":8},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"lineWidth":1,"fillOpacity":8,"showPoints":"never","thresholdsStyle":{"mode":"line"}},"unit":"percentunit","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":0.05}]}},"overrides":[]},"targets":[{"expr":"sum by (service) (rate(traefik_service_requests_total{code=~\"5..\"}[5m])) / sum by (service) (rate(traefik_service_requests_total[5m]))","legendFormat":"{{service}}","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"description":"TraefikHigh5xxRatio fires above 5% for 10 minutes.","options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["max"]},"tooltip":{"mode":"multi"}}},
                    {"id":8,"type":"timeseries","title":"p95 latency, per Traefik service","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"x":0,"y":18,"w":12,"h":8},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"lineWidth":1,"fillOpacity":8,"showPoints":"never","thresholdsStyle":{"mode":"line"}},"unit":"s","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},"overrides":[]},"targets":[{"expr":"histogram_quantile(0.95, sum by (le, service) (rate(traefik_service_request_duration_seconds_bucket[5m])))","legendFormat":"{{service}}","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"description":"TraefikHighLatency fires above 1s for 10 minutes. A value at the top bucket boundary means 'at least that slow'.","options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["max"]},"tooltip":{"mode":"multi"}}},
                    {"id":9,"type":"timeseries","title":"Memory use vs limit, per container","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"x":12,"y":18,"w":12,"h":8},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"lineWidth":1,"fillOpacity":8,"showPoints":"never","thresholdsStyle":{"mode":"line"}},"unit":"percentunit","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":0.9}]}},"overrides":[]},"targets":[{"expr":"max by (namespace, pod, container) (container_memory_working_set_bytes{namespace=~\"ztk-.+\", container!=\"\", container!=\"POD\"}) / on (namespace, pod, container) max by (namespace, pod, container) (container_spec_memory_limit_bytes{namespace=~\"ztk-.+\", container!=\"\", container!=\"POD\"} > 0)","legendFormat":"{{pod}} / {{container}}","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"description":"ContainerMemoryNearLimit fires above 90% for 10 minutes. Containers without a memory limit are not shown.","options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["max"]},"tooltip":{"mode":"multi"}}},
                    {"id":10,"type":"timeseries","title":"Memory (working set), per pod","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"x":0,"y":26,"w":12,"h":8},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"lineWidth":1,"fillOpacity":8,"showPoints":"never"},"unit":"bytes"},"overrides":[]},"targets":[{"expr":"sum by (pod) (container_memory_working_set_bytes{namespace=~\"ztk-.+\", container!=\"\", container!=\"POD\"})","legendFormat":"{{pod}}","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["max"]},"tooltip":{"mode":"multi"}}},
                    {"id":11,"type":"timeseries","title":"CPU, per pod","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"x":12,"y":26,"w":12,"h":8},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"custom":{"lineWidth":1,"fillOpacity":8,"showPoints":"never"},"unit":"cores"},"overrides":[]},"targets":[{"expr":"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"ztk-.+\", container!=\"\", container!=\"POD\"}[5m]))","legendFormat":"{{pod}}","refId":"A","datasource":{"type":"prometheus","uid":"prometheus"}}],"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["max"]},"tooltip":{"mode":"multi"}}}
                  ]
                }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
