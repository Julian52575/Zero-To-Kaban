# Prometheus + Alertmanager for the shared/production cluster (ADR: discussion
# #131). Same chart, version and rules as monitoring-k3s-app.yaml: try a change
# there first and keep the two in step.
#
# Differences, so prod data survives a restart and nothing changes without a
# human: data on PersistentVolumes with the TSDB capped below the volume size, no
# auto-sync and no finalizer (`argocd app sync ztk-monitoring-prod`), and
# resource requests plus a memory limit on the server.
#
# ClusterIP only: reach the UIs with `kubectl port-forward` (deployment/README.md).
# The Alertmanager receiver is a no-op until a real target is chosen; keep its URL
# in a Secret. Needs Traefik's `prometheus.io/*` pod annotations (k3s has them)
# and a default StorageClass. Created by root-app.yaml, OutOfSync until synced.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ztk-monitoring-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.33.0
    helm:
      values: |
        kube-state-metrics:
          enabled: false
        prometheus-node-exporter:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        server:
          # Sized down for the VPS; the oldest data goes when either limit is hit.
          retention: 7d
          # Keep below persistentVolume.size (MB is 1024*1024 bytes).
          retentionSize: 1500MB
          persistentVolume:
            enabled: true
            size: 2Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
        alertmanager:
          enabled: true
          persistence:
            enabled: true
            size: 1Gi
          config:
            route:
              receiver: discard-all-alerts
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 3h
            receivers:
              - name: discard-all-alerts
        serverFiles:
          alerting_rules.yml:
            groups:
              - name: ztk-edge
                rules:
                  - alert: TraefikHigh5xxRatio
                    expr: |
                      sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))
                        / sum by (service) (rate(traefik_service_requests_total[5m])) > 0.05
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "{{ $labels.service }} answers more than 5% of requests with a 5xx"
                      description: "Over the last 5m, {{ $value | humanizePercentage }} of the requests Traefik routed to {{ $labels.service }} failed with a 5xx."
                  - alert: TraefikHighLatency
                    expr: |
                      histogram_quantile(0.95, sum by (le, service) (rate(traefik_service_request_duration_seconds_bucket[5m]))) > 1
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "{{ $labels.service }} p95 latency is above 1s"
                      description: "The 95th percentile of the request duration Traefik measured for {{ $labels.service }} is {{ $value | humanizeDuration }}."
              - name: ztk-workloads
                rules:
                  - alert: ContainerMemoryNearLimit
                    # max by (...): after a restart cAdvisor briefly exposes two series
                    # per container, which breaks a plain one-to-one match.
                    expr: |
                      max by (namespace, pod, container) (container_memory_working_set_bytes{namespace=~"ztk-.+", container!="", container!="POD"})
                        / on (namespace, pod, container)
                      max by (namespace, pod, container) (container_spec_memory_limit_bytes{namespace=~"ztk-.+", container!="", container!="POD"} > 0) > 0.9
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) uses over 90% of its memory limit"
                      description: "Working set is at {{ $value | humanizePercentage }} of the container's memory limit; it will be OOM-killed if it reaches it."
              - name: ztk-monitoring
                rules:
                  - alert: ScrapeTargetDown
                    expr: up{job=~"kubernetes-pods|kubernetes-nodes-cadvisor|prometheus"} == 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})"
                      description: "The target has been down for 5m, so the alerts that depend on it are blind."
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
