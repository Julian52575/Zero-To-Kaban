apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zero-to-kanban.fullname" . }}-auth
  labels:
    {{- include "zero-to-kanban.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  replicas: {{ .Values.auth.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "zero-to-kanban.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "zero-to-kanban.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: auth
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "zero-to-kanban.waitFor" (dict "name" "authdb" "host" (include "zero-to-kanban.authdb.host" .) "port" 5432 "image" .Values.auth.image "securityContext" .Values.securityContext) | nindent 8 }}
      containers:
        - name: auth
          image: "{{ .Values.auth.image.repository }}:{{ .Values.auth.image.tag }}"
          imagePullPolicy: {{ .Values.auth.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.auth.containerPort }}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zero-to-kanban.authdb.secretName" . }}
                  key: {{ include "zero-to-kanban.authdb.secretKey" . }}
            # Composed by Kubernetes from DB_PASSWORD (declared above, so $(...)
            # expands): the plaintext password never appears in the manifest.
            # The image's own CMD runs migrations and starts the server.
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.authdb.auth.username }}:$(DB_PASSWORD)@{{ include "zero-to-kanban.authdb.host" . }}:5432/{{ .Values.authdb.auth.database }}?schema=public"
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "zero-to-kanban.auth.secretName" . }}
                  key: {{ .Values.auth.existingSecretKey }}
            - name: COOKIE_SECURE
              value: {{ .Values.auth.cookieSecure | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.auth.resources | nindent 12 }}
