apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zero-to-kanban.fullname" . }}-backend
  labels:
    {{- include "zero-to-kanban.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "zero-to-kanban.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "zero-to-kanban.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "zero-to-kanban.waitFor" (dict "name" "postgresql" "host" (include "zero-to-kanban.postgresql.host" .) "port" 5432 "image" .Values.backend.image "securityContext" .Values.securityContext) | nindent 8 }}
        # The backend exits if RabbitMQ is unreachable at startup.
        {{- include "zero-to-kanban.waitFor" (dict "name" "rabbitmq" "host" (include "zero-to-kanban.rabbitmq.host" .) "port" 5672 "image" .Values.backend.image "securityContext" .Values.securityContext) | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zero-to-kanban.postgresql.secretName" . }}
                  key: {{ include "zero-to-kanban.postgresql.secretKey" . }}
            # Composed by Kubernetes from DB_PASSWORD (declared above, so $(...)
            # expands): the plaintext password never appears in the manifest.
            # The image's own CMD runs migrations and starts the server.
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgresql.auth.username }}:$(DB_PASSWORD)@{{ include "zero-to-kanban.postgresql.host" . }}:5432/{{ .Values.postgresql.auth.database }}?schema=public"
            - name: RABBITMQ_USER
              value: {{ .Values.rabbitmq.username | quote }}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zero-to-kanban.rabbitmq.secretName" . }}
                  key: {{ .Values.rabbitmq.existingSecretKey }}
            - name: RABBITMQ_HOST
              value: {{ include "zero-to-kanban.rabbitmq.host" . | quote }}
            - name: RABBITMQ_PORT
              value: "5672"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
