# Overrides for the dev environment. Used by the Argo CD Applications in
# deployment/argocd/environments/dev-app.yaml, dev-k3s-app.yaml and
# dev-k3s-local-app.yaml.

backend:
  image:
    tag: latest
    pullPolicy: Always
  replicaCount: 1

auth:
  image:
    tag: latest
    pullPolicy: Always
  replicaCount: 1

frontend:
  image:
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  # Kept from when dev ran a hand-built image with the Vite/Rolldown dev
  # server in-cluster, which routinely needed several hundred MB and was
  # getting OOM-killed (memory.oom.group), taking down the whole rootless k3s
  # node with it. `latest` is the release image: the prebuilt static bundle
  # the base values.yaml's 128Mi limit assumes, so this is now more headroom
  # than it needs. Drop it if you never go back to the dev-server image.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

rabbitmq:
  persistence:
    size: 1Gi

postgresql:
  primary:
    persistence:
      size: 1Gi

authdb:
  primary:
    persistence:
      size: 1Gi
