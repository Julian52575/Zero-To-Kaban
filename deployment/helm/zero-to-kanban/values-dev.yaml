# Overrides for the dev environment. Used by the Argo CD Applications in
# deployment/argocd/environments/dev-app.yaml, dev-k3s-app.yaml and
# dev-k3s-local-app.yaml.

backend:
  image:
    tag: manual-test
    pullPolicy: Always
  replicaCount: 1

auth:
  image:
    tag: manual-test
    pullPolicy: Always
  replicaCount: 1
  # No login/register rate limits in dev, for load tests. Needs an auth image
  # that knows RATE_LIMIT_DISABLED; older images ignore it.
  rateLimitDisabled: "true"

frontend:
  image:
    tag: manual-test
    pullPolicy: Always
  replicaCount: 1
  # More than the static bundle needs (values.yaml: 128Mi). Kept from when dev
  # ran the Vite dev server in-cluster, whose OOM kills took the k3s node down.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

rabbitmq:
  persistence:
    size: 1Gi

postgresql:
  primary:
    persistence:
      size: 1Gi

authdb:
  primary:
    persistence:
      size: 1Gi
